<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Agency - TripLink</title>
    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

    <div class="auth-container">
    <div class="auth-card">

    <div class="auth-header">
        <h1>Register as Travel Agency</h1>
        <p>Join TripLink and start publishing your travel packages</p>
    </div>


    <form id="agencyRegisterForm">

        <div class="form-group">
            <label for="agencyName">Agency Name</label>
            <input type="text" id="agencyName" name="agencyName" required>
        </div>

        <div class="form-group">
            <label for="licenseNumber">License Number</label>
            <input type="text" id="licenseNumber" name="licenseNumber" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
        </div>

        <div class="form-group">
            <label for="documents">Registration Documents</label>
            <input type="file" id="documents" name="documents" accept=".pdf,.jpg,.jpeg,.png" required>
            <small>Accepted formats: PDF, JPG, PNG (Max 5MB)</small>
        </div>

        <button type="submit" class="btn-primary">Register Agency</button>
    </form>

    <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
</body>
